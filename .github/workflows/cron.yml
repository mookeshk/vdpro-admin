# GitHub Actions: بيصحّي البوت على Render كل 3 ساعات عشان يبعت تذكيرات انتهاء الاشتراك
# وإشعارات تفعيل الطلبات. المكان في ريبو vdpro-admin:  .github/workflows/cron.yml
# محتاج Secrets في الريبو (Settings > Secrets and variables > Actions):
#   BOT_URL      مثلاً https://your-bot.onrender.com
#   CRON_SECRET  نفس القيمة اللي في Render
name: bot-cron
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake bot and run jobs
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # أول طلب بيصحّي السيرفر (Render free بياخد لحد دقيقة)
          curl -sS -m 90 "$BOT_URL/" || true
          sleep 5
          curl -fsS -m 120 -H "x-cron-key: $CRON_SECRET" "$BOT_URL/cron/run"
